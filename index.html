<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- G3: theme-color from tokens (accent), light + dark. Replaces the stale #1d4ed8. -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0b0c" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="MyNewsHub — top stories across General, Business, Sports, Finance, Energy, Pop Culture and more. Live scores, AI summaries, and personalized feeds." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MyNewsHub" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="MyNewsHub — Your Daily Briefing" />
    <meta property="og:description" content="Top stories across General, Business, Sports, Finance, Energy, Pop Culture and more. Live scores, AI summaries, and personalized feeds." />
    <meta property="og:url" content="https://mynewshub2.vercel.app" />
    <meta property="og:site_name" content="MyNewsHub" />
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MyNewsHub — Your Daily Briefing" />
    <meta name="twitter:description" content="Top stories across General, Business, Sports, Finance, Energy, Pop Culture and more." />
    <link rel="manifest" href="/manifest.json" />
    <!-- AA3: self-hosted fonts (no Google Fonts, no third-party on the critical path).
         @font-face lives in src/styles/fonts.css; preload only the two LATIN variable files
         (Inter + Source Serif roman, ~97KB total) so first paint has its type without a blocking
         request. latin-ext loads on demand via unicode-range; metric-matched fallbacks make the
         swap shift-free. -->
    <link rel="preload" href="/fonts/inter-latin-wght.f052ee44.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/source-serif-4-latin-wght.0804a88d.woff2" as="font" type="font/woff2" crossorigin />
    <title>MyNewsHub — Your Daily Briefing</title>
    <!-- N2: declare both schemes so the browser paints the correct canvas background BEFORE CSS/JS
         load (no white flash for dark-system users) and native controls/scrollbars match the theme. -->
    <style>* { margin: 0; padding: 0; box-sizing: border-box; } html { color-scheme: light dark; }</style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
