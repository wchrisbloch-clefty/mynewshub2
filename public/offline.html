<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>MyNewsHub — Offline</title>
  <style>
    :root{color-scheme:light dark;}
    html,body{margin:0;height:100%;}
    body{display:flex;align-items:center;justify-content:center;
      font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,sans-serif;
      background:#f4f4f2;color:#111113;padding:24px;text-align:center;}
    @media (prefers-color-scheme: dark){ body{background:#0b0b0c;color:#f2f2ee;} }
    .wrap{max-width:420px;}
    .mark{width:56px;height:56px;border-radius:12px;background:#12558c;display:inline-flex;
      align-items:center;justify-content:center;margin-bottom:18px;}
    h1{font-size:20px;font-weight:800;margin:0 0 8px;letter-spacing:-0.3px;}
    p{font-size:14px;line-height:1.5;color:#6b6e75;margin:0 0 18px;}
    @media (prefers-color-scheme: dark){ p{color:#7e8088;} }
    a{display:inline-block;background:#12558c;color:#fff;text-decoration:none;
      font-weight:700;font-size:14px;padding:10px 18px;border-radius:4px;}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="mark">
      <svg width="30" height="30" viewBox="0 0 100 100" aria-hidden="true"><path d="M30 74V26l40 48V26" fill="none" stroke="#fff" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <h1>You're offline</h1>
    <p>We couldn't reach the network. Your last loaded stories are still available in the app — reconnect to refresh.</p>
    <a href="/">Try again</a>
  </div>
</body>
</html>
